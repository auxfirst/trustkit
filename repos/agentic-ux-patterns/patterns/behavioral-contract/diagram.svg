<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-label="Behavioral Contract: a pin change re-runs golden cases and produces a changelog">
  <title>Behavioral Contract: a pin change re-runs golden cases and produces a changelog</title>
  <style>
    .bg   { fill: #ffffff; }
    .box  { fill: #f6f7f9; stroke: #c7ccd4; stroke-width: 1.5; }
    .box.accent { fill: #eef2ff; stroke: #7c85f0; }
    .box.warn   { fill: #fdf1ec; stroke: #e08c68; }
    .box.good   { fill: #edf7f0; stroke: #6fae86; }
    .t    { fill: #23272e; font: 13px ui-sans-serif, system-ui, sans-serif; }
    .t.sm { font-size: 11px; fill: #5b636e; }
    .t.b  { font-weight: 600; }
    .ln   { stroke: #9aa2ad; stroke-width: 1.5; fill: none; }
    .ln.cut { stroke: #d0705a; stroke-dasharray: 5 4; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; }
      .box  { fill: #171b21; stroke: #39414d; }
      .box.accent { fill: #1b1f3a; stroke: #6c76de; }
      .box.warn   { fill: #2b1c16; stroke: #b8714f; }
      .box.good   { fill: #14261b; stroke: #4f8c67; }
      .t    { fill: #e5e9ef; }
      .t.sm { fill: #98a1ad; }
      .ln   { stroke: #626b78; }
      .ln.cut { stroke: #c9705c; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa2ad"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="220"/>
  <rect class="box warn" x="20" y="70" width="130" height="52" rx="7"/>
  <text class="t b" x="85.0" y="93.0" text-anchor="middle">pin moves</text>
  <text class="t sm" x="85.0" y="110.0" text-anchor="middle">model / prompt</text>
  <rect class="box accent" x="195" y="70" width="130" height="52" rx="7"/>
  <text class="t b" x="260.0" y="93.0" text-anchor="middle">golden cases</text>
  <text class="t sm" x="260.0" y="110.0" text-anchor="middle">assert properties</text>
  <rect class="box " x="370" y="70" width="120" height="52" rx="7"/>
  <text class="t b" x="430.0" y="101.0" text-anchor="middle">drift?</text>
  <rect class="box warn" x="530" y="14" width="170" height="52" rx="7"/>
  <text class="t b" x="615.0" y="37.0" text-anchor="middle">BLOCKED</text>
  <text class="t sm" x="615.0" y="54.0" text-anchor="middle">unacknowledged</text>
  <rect class="box good" x="530" y="124" width="170" height="52" rx="7"/>
  <text class="t b" x="615.0" y="147.0" text-anchor="middle">changelog entry</text>
  <text class="t sm" x="615.0" y="164.0" text-anchor="middle">acknowledged</text>
  <path class="ln " d="M150,96 L195,96" marker-end="url(#a)"/>
  <path class="ln " d="M325,96 L370,96" marker-end="url(#a)"/>
  <path class="ln " d="M490,96 H510"/>
  <path class="ln " d="M510,40 V150"/>
  <path class="ln " d="M510,40 H530" marker-end="url(#a)"/>
  <path class="ln " d="M510,150 H530" marker-end="url(#a)"/>
  <text class="t sm" x="360" y="205" text-anchor="middle">drift does not block the release — it blocks a silent one</text>
</svg>
