<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 215" width="720" height="215" role="img" aria-label="Confidence Cues: the band is computed from evidence and changes the surface">
  <title>Confidence Cues: the band is computed from evidence and changes the surface</title>
  <style>
    .bg   { fill: #ffffff; }
    .box  { fill: #f6f7f9; stroke: #c7ccd4; stroke-width: 1.5; }
    .box.accent { fill: #eef2ff; stroke: #7c85f0; }
    .box.warn   { fill: #fdf1ec; stroke: #e08c68; }
    .box.good   { fill: #edf7f0; stroke: #6fae86; }
    .t    { fill: #23272e; font: 13px ui-sans-serif, system-ui, sans-serif; }
    .t.sm { font-size: 11px; fill: #5b636e; }
    .t.b  { font-weight: 600; }
    .ln   { stroke: #9aa2ad; stroke-width: 1.5; fill: none; }
    .ln.cut { stroke: #d0705a; stroke-dasharray: 5 4; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; }
      .box  { fill: #171b21; stroke: #39414d; }
      .box.accent { fill: #1b1f3a; stroke: #6c76de; }
      .box.warn   { fill: #2b1c16; stroke: #b8714f; }
      .box.good   { fill: #14261b; stroke: #4f8c67; }
      .t    { fill: #e5e9ef; }
      .t.sm { fill: #98a1ad; }
      .ln   { stroke: #626b78; }
      .ln.cut { stroke: #c9705c; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa2ad"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="215"/>
  <rect class="box " x="20" y="80" width="130" height="52" rx="7"/>
  <text class="t b" x="85.0" y="103.0" text-anchor="middle">claim + evidence</text>
  <text class="t sm" x="85.0" y="120.0" text-anchor="middle">score, sources</text>
  <rect class="box accent" x="200" y="80" width="120" height="52" rx="7"/>
  <text class="t b" x="260.0" y="103.0" text-anchor="middle">band()</text>
  <text class="t sm" x="260.0" y="120.0" text-anchor="middle">one threshold table</text>
  <rect class="box good" x="380" y="10" width="150" height="48" rx="7"/>
  <text class="t b" x="455.0" y="31.0" text-anchor="middle">assert + cite</text>
  <text class="t sm" x="455.0" y="48.0" text-anchor="middle">grounded</text>
  <rect class="box " x="380" y="80" width="150" height="48" rx="7"/>
  <text class="t b" x="455.0" y="101.0" text-anchor="middle">hedge + show leap</text>
  <text class="t sm" x="455.0" y="118.0" text-anchor="middle">inferred</text>
  <rect class="box warn" x="380" y="150" width="150" height="48" rx="7"/>
  <text class="t b" x="455.0" y="171.0" text-anchor="middle">refuse + name need</text>
  <text class="t sm" x="455.0" y="188.0" text-anchor="middle">unsupported</text>
  <path class="ln " d="M150,106 L200,106" marker-end="url(#a)"/>
  <path class="ln " d="M320,106 H350"/>
  <path class="ln " d="M350,34 V174"/>
  <path class="ln " d="M350,34 H380" marker-end="url(#a)"/>
  <path class="ln " d="M350,106 H380" marker-end="url(#a)"/>
  <path class="ln " d="M350,174 H380" marker-end="url(#a)"/>
  <text class="t sm" x="620" y="38" text-anchor="middle">user can act</text>
  <text class="t sm" x="620" y="108" text-anchor="middle">act, caveat visible</text>
  <text class="t sm" x="620" y="178" text-anchor="middle">agent says no</text>
</svg>
