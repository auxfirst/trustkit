<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-label="Intent Handshake: gate by stakes, once, with a full preview">
  <title>Intent Handshake: gate by stakes, once, with a full preview</title>
  <style>
    .bg   { fill: #ffffff; }
    .box  { fill: #f6f7f9; stroke: #c7ccd4; stroke-width: 1.5; }
    .box.accent { fill: #eef2ff; stroke: #7c85f0; }
    .box.warn   { fill: #fdf1ec; stroke: #e08c68; }
    .box.good   { fill: #edf7f0; stroke: #6fae86; }
    .t    { fill: #23272e; font: 13px ui-sans-serif, system-ui, sans-serif; }
    .t.sm { font-size: 11px; fill: #5b636e; }
    .t.b  { font-weight: 600; }
    .ln   { stroke: #9aa2ad; stroke-width: 1.5; fill: none; }
    .ln.cut { stroke: #d0705a; stroke-dasharray: 5 4; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; }
      .box  { fill: #171b21; stroke: #39414d; }
      .box.accent { fill: #1b1f3a; stroke: #6c76de; }
      .box.warn   { fill: #2b1c16; stroke: #b8714f; }
      .box.good   { fill: #14261b; stroke: #4f8c67; }
      .t    { fill: #e5e9ef; }
      .t.sm { fill: #98a1ad; }
      .ln   { stroke: #626b78; }
      .ln.cut { stroke: #c9705c; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa2ad"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="200"/>
  <rect class="box " x="20" y="70" width="120" height="52" rx="7"/>
  <text class="t b" x="80.0" y="93.0" text-anchor="middle">plan</text>
  <text class="t sm" x="80.0" y="110.0" text-anchor="middle">n steps</text>
  <rect class="box accent" x="190" y="70" width="130" height="52" rx="7"/>
  <text class="t b" x="255.0" y="93.0" text-anchor="middle">stakes?</text>
  <text class="t sm" x="255.0" y="110.0" text-anchor="middle">low / non-trivial</text>
  <rect class="box good" x="370" y="16" width="150" height="52" rx="7"/>
  <text class="t b" x="445.0" y="39.0" text-anchor="middle">execute</text>
  <text class="t sm" x="445.0" y="56.0" text-anchor="middle">low stakes</text>
  <rect class="box warn" x="370" y="110" width="150" height="52" rx="7"/>
  <text class="t b" x="445.0" y="133.0" text-anchor="middle">preview + wait</text>
  <text class="t sm" x="445.0" y="150.0" text-anchor="middle">ok / edit / cancel</text>
  <rect class="box good" x="570" y="110" width="130" height="52" rx="7"/>
  <text class="t b" x="635.0" y="133.0" text-anchor="middle">execute</text>
  <text class="t sm" x="635.0" y="150.0" text-anchor="middle">after ok</text>
  <path class="ln " d="M140,96 L190,96" marker-end="url(#a)"/>
  <path class="ln " d="M320,96 H345"/>
  <path class="ln " d="M345,42 V136"/>
  <path class="ln " d="M345,42 H370" marker-end="url(#a)"/>
  <path class="ln " d="M345,136 H370" marker-end="url(#a)"/>
  <path class="ln " d="M520,136 L570,136" marker-end="url(#a)"/>
  <text class="t sm" x="352" y="32" text-anchor="end">low</text>
  <text class="t sm" x="352" y="172" text-anchor="end">non-trivial</text>
  <text class="t sm" x="635" y="182" text-anchor="middle">cancel → stop</text>
</svg>
