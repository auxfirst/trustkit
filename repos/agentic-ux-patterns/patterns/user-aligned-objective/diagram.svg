<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 222" width="720" height="222" role="img" aria-label="User-Aligned Objective: two scores, never blended, user ranking wins">
  <title>User-Aligned Objective: two scores, never blended, user ranking wins</title>
  <style>
    .bg   { fill: #ffffff; }
    .box  { fill: #f6f7f9; stroke: #c7ccd4; stroke-width: 1.5; }
    .box.accent { fill: #eef2ff; stroke: #7c85f0; }
    .box.warn   { fill: #fdf1ec; stroke: #e08c68; }
    .box.good   { fill: #edf7f0; stroke: #6fae86; }
    .t    { fill: #23272e; font: 13px ui-sans-serif, system-ui, sans-serif; }
    .t.sm { font-size: 11px; fill: #5b636e; }
    .t.b  { font-weight: 600; }
    .ln   { stroke: #9aa2ad; stroke-width: 1.5; fill: none; }
    .ln.cut { stroke: #d0705a; stroke-dasharray: 5 4; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; }
      .box  { fill: #171b21; stroke: #39414d; }
      .box.accent { fill: #1b1f3a; stroke: #6c76de; }
      .box.warn   { fill: #2b1c16; stroke: #b8714f; }
      .box.good   { fill: #14261b; stroke: #4f8c67; }
      .t    { fill: #e5e9ef; }
      .t.sm { fill: #98a1ad; }
      .ln   { stroke: #626b78; }
      .ln.cut { stroke: #c9705c; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa2ad"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="222"/>
  <rect class="box " x="20" y="74" width="120" height="52" rx="7"/>
  <text class="t b" x="80.0" y="105.0" text-anchor="middle">options</text>
  <rect class="box good" x="190" y="14" width="180" height="50" rx="7"/>
  <text class="t b" x="280.0" y="36.0" text-anchor="middle">user_value()</text>
  <text class="t sm" x="280.0" y="53.0" text-anchor="middle">fit, cost, effort</text>
  <rect class="box warn" x="190" y="132" width="180" height="50" rx="7"/>
  <text class="t b" x="280.0" y="154.0" text-anchor="middle">platform_value()</text>
  <text class="t sm" x="280.0" y="171.0" text-anchor="middle">margin</text>
  <rect class="box accent" x="420" y="74" width="130" height="52" rx="7"/>
  <text class="t b" x="485.0" y="97.0" text-anchor="middle">compare</text>
  <text class="t sm" x="485.0" y="114.0" text-anchor="middle">never summed</text>
  <rect class="box good" x="580" y="74" width="120" height="52" rx="7"/>
  <text class="t b" x="640.0" y="97.0" text-anchor="middle">user wins</text>
  <text class="t sm" x="640.0" y="114.0" text-anchor="middle">+ disclose</text>
  <path class="ln " d="M140,100 H165"/>
  <path class="ln " d="M165,39 V157"/>
  <path class="ln " d="M165,39 H190" marker-end="url(#a)"/>
  <path class="ln " d="M165,157 H190" marker-end="url(#a)"/>
  <path class="ln " d="M370,39 H395"/>
  <path class="ln " d="M370,157 H395"/>
  <path class="ln " d="M395,39 V157"/>
  <path class="ln " d="M395,100 H420" marker-end="url(#a)"/>
  <path class="ln " d="M550,100 L580,100" marker-end="url(#a)"/>
  <text class="t sm" x="360" y="208" text-anchor="middle">kept separate, so "would we still recommend this if we earned nothing?" has an answer</text>
</svg>
