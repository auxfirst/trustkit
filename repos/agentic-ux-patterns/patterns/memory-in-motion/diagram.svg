<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 215" width="720" height="215" role="img" aria-label="Memory in Motion: what is learned in one session is available and editable in the next">
  <title>Memory in Motion: what is learned in one session is available and editable in the next</title>
  <style>
    .bg   { fill: #ffffff; }
    .box  { fill: #f6f7f9; stroke: #c7ccd4; stroke-width: 1.5; }
    .box.accent { fill: #eef2ff; stroke: #7c85f0; }
    .box.warn   { fill: #fdf1ec; stroke: #e08c68; }
    .box.good   { fill: #edf7f0; stroke: #6fae86; }
    .t    { fill: #23272e; font: 13px ui-sans-serif, system-ui, sans-serif; }
    .t.sm { font-size: 11px; fill: #5b636e; }
    .t.b  { font-weight: 600; }
    .ln   { stroke: #9aa2ad; stroke-width: 1.5; fill: none; }
    .ln.cut { stroke: #d0705a; stroke-dasharray: 5 4; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; }
      .box  { fill: #171b21; stroke: #39414d; }
      .box.accent { fill: #1b1f3a; stroke: #6c76de; }
      .box.warn   { fill: #2b1c16; stroke: #b8714f; }
      .box.good   { fill: #14261b; stroke: #4f8c67; }
      .t    { fill: #e5e9ef; }
      .t.sm { fill: #98a1ad; }
      .ln   { stroke: #626b78; }
      .ln.cut { stroke: #c9705c; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa2ad"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="215"/>
  <rect class="box " x="20" y="60" width="140" height="56" rx="7"/>
  <text class="t b" x="90.0" y="85.0" text-anchor="middle">session 1</text>
  <text class="t sm" x="90.0" y="102.0" text-anchor="middle">user states a preference</text>
  <rect class="box accent" x="290" y="20" width="150" height="56" rx="7"/>
  <text class="t b" x="365.0" y="45.0" text-anchor="middle">memory store</text>
  <text class="t sm" x="365.0" y="62.0" text-anchor="middle">scoped, user-visible</text>
  <rect class="box good" x="560" y="60" width="140" height="56" rx="7"/>
  <text class="t b" x="630.0" y="85.0" text-anchor="middle">session 2</text>
  <text class="t sm" x="630.0" y="102.0" text-anchor="middle">agent recalls it</text>
  <path class="ln " d="M160,88 L290,60" marker-end="url(#a)"/>
  <path class="ln " d="M440,60 L560,88" marker-end="url(#a)"/>
  <rect class="box good" x="290" y="120" width="150" height="56" rx="7"/>
  <text class="t b" x="365.0" y="145.0" text-anchor="middle">user can see + edit</text>
  <text class="t sm" x="365.0" y="162.0" text-anchor="middle">not a black box</text>
  <path class="ln" d="M365,76 V120"/>
  <text class="t sm" x="225" y="50" text-anchor="middle">write</text>
  <text class="t sm" x="505" y="50" text-anchor="middle">read</text>
  <text class="t sm" x="360" y="196" text-anchor="middle">amnesia is the default; continuity is the feature</text>
</svg>
