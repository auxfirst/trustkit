<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 215" width="720" height="215" role="img" aria-label="Memory Policy Scoping: ancestors are readable, siblings are not">
  <title>Memory Policy Scoping: ancestors are readable, siblings are not</title>
  <style>
    .bg   { fill: #ffffff; }
    .box  { fill: #f6f7f9; stroke: #c7ccd4; stroke-width: 1.5; }
    .box.accent { fill: #eef2ff; stroke: #7c85f0; }
    .box.warn   { fill: #fdf1ec; stroke: #e08c68; }
    .box.good   { fill: #edf7f0; stroke: #6fae86; }
    .t    { fill: #23272e; font: 13px ui-sans-serif, system-ui, sans-serif; }
    .t.sm { font-size: 11px; fill: #5b636e; }
    .t.b  { font-weight: 600; }
    .ln   { stroke: #9aa2ad; stroke-width: 1.5; fill: none; }
    .ln.cut { stroke: #d0705a; stroke-dasharray: 5 4; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; }
      .box  { fill: #171b21; stroke: #39414d; }
      .box.accent { fill: #1b1f3a; stroke: #6c76de; }
      .box.warn   { fill: #2b1c16; stroke: #b8714f; }
      .box.good   { fill: #14261b; stroke: #4f8c67; }
      .t    { fill: #e5e9ef; }
      .t.sm { fill: #98a1ad; }
      .ln   { stroke: #626b78; }
      .ln.cut { stroke: #c9705c; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa2ad"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="215"/>
  <rect class="box accent" x="280" y="14" width="160" height="44" rx="7"/>
  <text class="t b" x="360.0" y="33.0" text-anchor="middle">acme</text>
  <text class="t sm" x="360.0" y="50.0" text-anchor="middle">parent scope</text>
  <rect class="box warn" x="90" y="110" width="180" height="48" rx="7"/>
  <text class="t b" x="180.0" y="131.0" text-anchor="middle">acme / northgate</text>
  <text class="t sm" x="180.0" y="148.0" text-anchor="middle">sibling</text>
  <rect class="box good" x="450" y="110" width="180" height="48" rx="7"/>
  <text class="t b" x="540.0" y="131.0" text-anchor="middle">acme / riverbend</text>
  <text class="t sm" x="540.0" y="148.0" text-anchor="middle">current context</text>
  <path class="ln" d="M360,58 V84 H180 V110"/>
  <path class="ln" d="M360,58 V84 H540 V110"/>
  <path class="ln cut" d="M270,134 H450"/>
  <text class="t sm" x="360" y="128" text-anchor="middle" style="font-weight:600">✕</text>
  <text class="t sm" x="360" y="182" text-anchor="middle">ancestors readable · siblings never · bridge is one-shot and named</text>
  <text class="t sm" x="360" y="202" text-anchor="middle">withheld hits are surfaced as an offer, not silently dropped</text>
</svg>
