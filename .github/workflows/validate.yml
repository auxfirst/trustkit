# .github/workflows/validate.yml
#
# Lints YAML schemas + checks markdown links on every PR that touches docs,
# schemas, or workflows. Catches the load-bearing failures cheaply:
#   - YAML syntax errors in /schemas/
#   - broken internal links across onboarding/forwardables/repos
#   - aux-audit failing its own test suite, or drifting from the canonical schemas
#   - a taxonomy gap with no pattern, or a pattern missing one of its four files
#   - cross-schema drift: a gap pointing at a heuristic that does not exist, or
#     two schemas disagreeing on the same enum
#
# Local repro:
#   yamllint schemas/ .github/    (colons disabled: agent-spec v1 aligns $ref columns)
#   lychee --offline --no-progress --include-fragments=full --include-mail=false '**/*.md'
#   npm --prefix packages/aux-audit ci && npm --prefix packages/aux-audit test

name: validate

on:
  pull_request:
    paths:
      - "schemas/**"
      - "onboarding/**"
      - "repos/**/README.md"
      - "profile/**"
      - "docs/**"
      - "packages/**"
      - "repos/agentic-ux-patterns/**"
      - "action.yml"
      - "*.md"
      - ".github/workflows/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yaml:
    name: YAML schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install --quiet yamllint==1.35.1

      - name: Lint schemas
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}, colons: disable}}" schemas/

      - name: Lint workflows + Issue templates
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}, colons: disable}}" .github/

      - name: Install jsonschema
        run: pip install --quiet jsonschema

      # yamllint proves each file is well-formed. This proves they agree with
      # each other: every gap resolves to a real heuristic and trust stage,
      # every heat band to an autonomy level, and enums duplicated across
      # schemas stay in step. Checks whose source key is absent report `skip`,
      # never `ok`.
      - name: Cross-schema references
        run: python schemas/validate.py

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links (offline + relative paths)
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --offline
            --no-progress
            --include-fragments=full
            --include-mail=false
            --exclude '^https?://'
            './**/*.md'
          fail: true

  aux-audit:
    name: aux-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/aux-audit/package-lock.json

      - name: Install
        working-directory: packages/aux-audit
        run: npm ci

      # The package ships a copy of schemas/ so the npm tarball is self-contained.
      # If the copy drifts from the canonical definitions, the published tool
      # would grade against a stale standard — so fail loudly instead.
      - name: Check bundled schemas match schemas/
        working-directory: packages/aux-audit
        run: npm run check:schemas

      - name: Test
        working-directory: packages/aux-audit
        run: npm test

      - name: Smoke-test the CLI contract
        working-directory: packages/aux-audit
        run: |
          set -euo pipefail
          node dist/cli.js run fixtures/strong-spec.yaml --fail-on critical > /dev/null
          node dist/cli.js run fixtures/weak-spec.yaml --format sarif --out /tmp/audit.sarif || true
          node -e "
            const s = JSON.parse(require('fs').readFileSync('/tmp/audit.sarif', 'utf8'));
            if (s.version !== '2.1.0') throw new Error('bad SARIF version');
            if (s.runs[0].results.length === 0) throw new Error('expected findings');
          "
          if node dist/cli.js run fixtures/invalid-spec.yaml > /dev/null 2>&1; then
            echo "expected an invalid spec to be refused"; exit 1
          fi

  patterns:
    name: pattern coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet pyyaml

      # CONTRIBUTING says a pattern PR is rejected if any of the four files are
      # missing, and the patterns README claims every named gap is closed.
      # Both are executed here rather than trusted.
      - name: Every gap closed, every pattern complete, every example runnable
        run: python repos/agentic-ux-patterns/check-coverage.py
