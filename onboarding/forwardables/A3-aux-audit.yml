# .github/workflows/aux-audit.yml
# Drop this into your repo. Point at your spec. Ship.
#
# Scores your agent product against the 10 AUX Heuristics on every PR that
# touches the spec, the flows, or the golden transcripts:
#   - uploads SARIF, so findings land in the Security tab and on the diff
#   - posts a scorecard as a sticky PR comment
#   - fails the build on any severity: high finding
#
# Local repro:  node packages/aux-audit/dist/cli.js run ./spec.yaml --fail-on high
# Source:       https://github.com/auxfirst/trustkit/tree/main/packages/aux-audit
# The Action runs the CLI from the trustkit checkout (version: local).
# Pin `version: 0.1.0` only after aux-audit is on npm.

name: aux-audit

on:
  pull_request:
    paths:
      - "spec.yaml"
      - "flows/**"
      - "transcripts/**"
      - "audit.config.yaml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # required to upload SARIF
  pull-requests: write     # required to comment the scorecard

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run aux-audit
        id: aux
        uses: auxfirst/trustkit@v0.2
        with:
          spec: ./spec.yaml
          config: ./audit.config.yaml
          fail-on: high

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: audit.sarif
          category: aux-audit

      - name: Comment scorecard
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: aux-audit
          path: audit-summary.md
